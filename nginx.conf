server {
  listen 80;
  server_name www.espacio-raku.com;
  return 301 https://espacio-raku.com$request_uri;
}

server {
  listen 80 default_server;
  server_name espacio-raku.com _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

  location ^~ /assets/optimized/v1/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|woff2?|ttf|otf)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico)$ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
